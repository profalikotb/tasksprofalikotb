<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F4F5FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0C12" media="(prefers-color-scheme: dark)">
  <title>Smart Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4F5FB; --card: #FFFFFF; --text: #0B0B14; --dim: #6B6F80; --faint: #A3A7B7; --line: #E7E8F0;
      --indigo: #5B3DF5; --pink: #FF2D78; --blue: #2F6BFF; --red: #FF3B30; --orange: #FF7A00;
      --amber: #F5A300; --green: #12B76A; --teal: #00A6C8; --purple: #9B51E0;
      --shadow: 0 6px 20px rgba(20,24,60,.08);
      --tag-l: 40%;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B0C12; --card: #161824; --text: #F4F5FA; --dim: #9EA3B8; --faint: #5E6278; --line: #262939;
        --indigo: #8F7BFF; --shadow: 0 6px 20px rgba(0,0,0,.45); --tag-l: 72%;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "Inter", "Cairo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(900px 360px at 0% -8%, rgba(91,61,245,.16), transparent 60%),
        radial-gradient(800px 360px at 100% -4%, rgba(255,45,120,.13), transparent 60%);
      background-repeat: no-repeat;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      padding: calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 84px);
      min-height: 100vh;
    }
    button { font-family: inherit; }
    .wrap { max-width: 560px; margin: 0 auto; }

    /* Header */
    .top { display: flex; justify-content: space-between; align-items: center; margin: 6px 2px 14px; }
    .date-line { font-size: 12px; font-weight: 900; letter-spacing: .14em; color: var(--indigo); text-transform: uppercase; }
    h1 {
      margin: 2px 0 0; font-size: 34px; font-weight: 900; letter-spacing: -.035em;
      background: linear-gradient(120deg, var(--indigo), var(--pink) 55%, var(--orange));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .ring {
      --p: 0; width: 60px; height: 60px; border-radius: 50%; flex-shrink: 0; position: relative;
      display: grid; place-items: center;
      background: conic-gradient(var(--green) calc(var(--p) * 1%), var(--line) 0);
      box-shadow: var(--shadow);
    }
    .ring::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--card); }
    .ring span { position: relative; font-weight: 900; font-size: 14px; }

    /* Stats (also filters) */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .stat {
      border: 0; border-radius: 16px; padding: 10px 10px 9px; color: #fff; cursor: pointer; text-align: start;
      display: flex; flex-direction: column; gap: 3px; box-shadow: var(--shadow);
      transition: transform .15s ease, outline-color .15s; outline: 3px solid transparent; outline-offset: 2px;
    }
    .stat b { font-size: 24px; font-weight: 900; line-height: 1; }
    .stat span { font-size: 10.5px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; opacity: .92; }
    .stat:active { transform: scale(.95); }
    .stat.active { outline-color: var(--text); }
    .s-over  { background: linear-gradient(135deg, #FF5A5F, #E0115F); }
    .s-today { background: linear-gradient(135deg, #FFB020, #FF6A00); }
    .s-high  { background: linear-gradient(135deg, #9A6BFF, #5B3DF5); }
    .s-done  { background: linear-gradient(135deg, #2BD88A, #0EA968); }

    /* Add card */
    .add {
      border-radius: 20px; padding: 12px; margin-bottom: 14px; box-shadow: var(--shadow);
      border: 2px solid transparent;
      background-image: linear-gradient(var(--card), var(--card)), linear-gradient(120deg, var(--indigo), var(--pink), var(--orange));
      background-origin: border-box; background-clip: padding-box, border-box;
    }
    .add-row { display: flex; gap: 10px; align-items: center; }
    #taskInput {
      flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text);
      font-family: inherit; font-size: 17px; font-weight: 800; padding: 8px 4px;
    }
    #taskInput::placeholder { color: var(--faint); font-weight: 600; }
    .add-btn {
      width: 46px; height: 46px; border-radius: 14px; border: 0; color: #fff; cursor: pointer; flex-shrink: 0;
      font-size: 28px; font-weight: 900; line-height: 1;
      background: linear-gradient(135deg, var(--indigo), var(--pink));
      box-shadow: 0 6px 14px rgba(91,61,245,.35); transition: transform .1s;
    }
    .add-btn:active { transform: scale(.92); }
    .preview { display: flex; flex-wrap: wrap; gap: 6px; }
    .preview:not(:empty) { margin-top: 8px; }
    .hint { font-size: 11.5px; font-weight: 700; color: var(--faint); margin-top: 6px; }
    .hint b { color: var(--dim); font-weight: 900; }
    .opts {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-top: 10px; padding-top: 10px; border-top: 1.5px dashed var(--line);
    }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

    /* Chips */
    .chip {
      border: 1.5px solid var(--line); background: transparent; color: var(--dim); cursor: pointer;
      font-size: 12px; font-weight: 800; padding: 6px 11px; border-radius: 999px; white-space: nowrap;
      transition: all .15s ease; display: inline-flex; align-items: center; gap: 4px;
    }
    .chip:active { transform: scale(.95); }
    .chip.low.active  { background: var(--green);  border-color: var(--green);  color: #fff; }
    .chip.med.active  { background: var(--orange); border-color: var(--orange); color: #fff; }
    .chip.high.active { background: var(--red);    border-color: var(--red);    color: #fff; }
    .chip.d.active, .chip.f.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .chip em { font-style: normal; }
    .pick { position: relative; overflow: hidden; }
    .pick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .pv { cursor: default; font-size: 11px; padding: 3px 9px; border-width: 0; }
    .pv.p-low  { background: color-mix(in srgb, var(--green) 16%, transparent);  color: var(--green); }
    .pv.p-med  { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
    .pv.p-high { background: color-mix(in srgb, var(--red) 16%, transparent);    color: var(--red); }
    .pv.due    { background: color-mix(in srgb, var(--blue) 14%, transparent);   color: var(--blue); }

    /* Toolbar */
    .toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
    #search {
      flex: 1; min-width: 0; border: 0; border-radius: 12px; padding: 11px 12px; outline: 0;
      background: var(--card); color: var(--text); box-shadow: var(--shadow);
      font-family: inherit; font-size: 16px; font-weight: 700;
    }
    #search::placeholder { color: var(--faint); }
    .ghost {
      border: 0; border-radius: 12px; padding: 0 14px; background: var(--card); color: var(--indigo);
      font-size: 13px; font-weight: 900; box-shadow: var(--shadow); cursor: pointer; white-space: nowrap;
    }
    .filters { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }

    /* Tags */
    .tag {
      --h: 220; font-size: 11px; font-weight: 900; padding: 2px 8px; border-radius: 999px;
      background: hsl(var(--h) 85% 55% / .15); color: hsl(var(--h) 75% var(--tag-l));
    }
    .chip.tagf { --h: 220; color: hsl(var(--h) 75% var(--tag-l)); border-color: hsl(var(--h) 85% 55% / .35); }
    .chip.tagf.active { background: hsl(var(--h) 75% 50%); border-color: hsl(var(--h) 75% 50%); color: #fff; }

    /* Groups & tasks */
    .group { margin-bottom: 14px; }
    .g-head {
      display: flex; align-items: center; gap: 8px; margin: 4px 4px 8px; color: var(--gc);
      font-size: 13px; font-weight: 900; letter-spacing: .09em; text-transform: uppercase;
    }
    .g-head::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gc);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--gc) 22%, transparent);
    }
    .g-count { background: var(--gc); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 11px; letter-spacing: 0; }
    .g-clear {
      margin-inline-start: auto; border: 0; background: transparent; color: var(--dim);
      font-size: 11px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
    }
    .task {
      --pc: var(--green);
      display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px;
      padding: 12px 8px 12px 12px; margin-bottom: 8px; box-shadow: var(--shadow);
      border-inline-start: 5px solid var(--pc);
    }
    [dir="rtl"] .task { padding: 12px 12px 12px 8px; }
    .task.p-high { --pc: var(--red); }
    .task.p-med  { --pc: var(--orange); }
    .task.p-low  { --pc: var(--green); }
    .task.new { animation: slideIn .28s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } }
    .chk {
      width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--pc); background: transparent;
      display: grid; place-items: center; cursor: pointer; flex-shrink: 0; padding: 0; transition: all .2s ease;
    }
    .chk svg { width: 15px; height: 15px; fill: #fff; opacity: 0; transform: scale(.4); transition: all .2s ease; }
    .task.done { opacity: .62; border-inline-start-color: var(--line); }
    .task.done .chk { background: var(--green); border-color: var(--green); }
    .task.done .chk svg { opacity: 1; transform: none; }
    .task.pop .chk { animation: pop .35s ease; }
    @keyframes pop { 50% { transform: scale(1.3); } }
    .body { flex: 1; min-width: 0; cursor: pointer; }
    .title { font-size: 16.5px; font-weight: 800; line-height: 1.32; word-break: break-word; }
    .task.done .title { text-decoration: line-through; color: var(--dim); font-weight: 600; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
    .pt {
      font-size: 10px; font-weight: 900; padding: 2px 7px; border-radius: 6px; letter-spacing: .06em;
      background: color-mix(in srgb, var(--pc) 16%, transparent); color: var(--pc);
    }
    .due { font-size: 12px; font-weight: 800; color: var(--dim); }
    .due.over { color: var(--red); }
    .due.today { color: var(--orange); }
    .del {
      border: 0; background: transparent; color: var(--faint); font-size: 24px; font-weight: 700; line-height: 1;
      cursor: pointer; padding: 6px 8px; border-radius: 10px; transition: all .15s;
    }
    .del:hover, .del:active { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }
    .empty { text-align: center; padding: 34px 10px; color: var(--dim); font-weight: 800; }
    .empty b { display: block; font-size: 34px; margin-bottom: 6px; }

    /* Sync pill + toast */
    .sync {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
      bottom: calc(env(safe-area-inset-bottom) + 14px);
      display: flex; align-items: center; gap: 8px; background: var(--card); padding: 8px 14px; border-radius: 999px;
      box-shadow: var(--shadow); font-size: 12px; font-weight: 800; color: var(--dim); white-space: nowrap;
    }
    .sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
    .sync[data-state="ok"] i { background: var(--green); }
    .sync[data-state="busy"] i { background: var(--amber); animation: pulse 1s infinite; }
    .sync[data-state="err"] i { background: var(--red); }
    @keyframes pulse { 50% { opacity: .3; } }
    .toast {
      position: fixed; left: 50%; z-index: 30; bottom: calc(env(safe-area-inset-bottom) + 62px);
      transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: all .25s ease;
      display: flex; align-items: center; gap: 14px; background: #1C1C28; color: #fff;
      padding: 11px 12px 11px 16px; border-radius: 14px; font-size: 13.5px; font-weight: 800;
      box-shadow: 0 10px 30px rgba(0,0,0,.3); max-width: calc(100vw - 28px);
    }
    .toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .toast button { border: 0; background: #FFD60A; color: #111; font-weight: 900; font-size: 13px; padding: 6px 12px; border-radius: 9px; cursor: pointer; }

    /* Edit sheet */
    .sheet-bg {
      position: fixed; inset: 0; z-index: 40; background: rgba(10,10,20,.45);
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto;
      background: var(--card); border-radius: 24px 24px 0 0;
      padding: 10px 16px calc(env(safe-area-inset-bottom) + 16px);
      transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
      box-shadow: 0 -10px 30px rgba(0,0,0,.2);
    }
    .sheet-open .sheet-bg { opacity: 1; pointer-events: auto; }
    .sheet-open .sheet { transform: none; }
    .grab { width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
    .sheet textarea, .sheet input[type="text"] {
      width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; outline: 0;
      background: transparent; color: var(--text); font-family: inherit; font-size: 17px; font-weight: 800; resize: none;
    }
    .sheet input[type="text"] { font-size: 16px; font-weight: 700; }
    .sheet textarea:focus, .sheet input[type="text"]:focus { border-color: var(--indigo); }
    .lbl { display: flex; justify-content: space-between; font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 14px 0 7px; }
    .lbl span { color: var(--blue); letter-spacing: .02em; }
    .actions { display: flex; gap: 8px; margin-top: 18px; }
    .btn { flex: 1; border: 0; border-radius: 14px; padding: 13px; font-size: 15px; font-weight: 900; cursor: pointer; }
    .btn.save { background: linear-gradient(135deg, var(--indigo), var(--pink)); color: #fff; }
    .btn.cancel { background: var(--bg); color: var(--text); }
    .btn.danger { flex: 0 0 auto; padding: 13px 16px; background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
  </style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="date-line" id="todayLine"></div>
      <h1>Smart Tasks</h1>
    </div>
    <div class="ring" id="ring"><span id="ringPct">0%</span></div>
  </header>

  <div class="stats" id="stats">
    <button class="stat s-over"  data-filter="overdue"><b id="cOver">0</b><span>Overdue</span></button>
    <button class="stat s-today" data-filter="today"><b id="cToday">0</b><span>Today</span></button>
    <button class="stat s-high"  data-filter="high"><b id="cHigh">0</b><span>High</span></button>
    <button class="stat s-done"  data-filter="done"><b id="cDone">0</b><span>Done</span></button>
  </div>

  <section class="add">
    <div class="add-row">
      <input type="text" id="taskInput" dir="auto" autocomplete="off" enterkeyhint="done"
             placeholder="Add task… e.g. Review MRI tomorrow !h #ward">
      <button class="add-btn" id="addBtn" aria-label="Add">+</button>
    </div>
    <div class="preview" id="preview"></div>
    <div class="hint"><b>!h !m !l</b> priority · <b>#tag</b> · <b>today / tomorrow / بكرة</b> · <b>@mon @15/10 @3d</b></div>
    <div class="opts">
      <div class="row" id="prioSeg">
        <button class="chip low"  data-p="low">Low</button>
        <button class="chip med"  data-p="med">Med</button>
        <button class="chip high" data-p="high">High</button>
      </div>
      <div class="row" id="dateSeg">
        <button class="chip d" data-d="0">Today</button>
        <button class="chip d" data-d="1">Tmrw</button>
        <button class="chip d" data-d="7">+1W</button>
        <label class="chip d pick">📅 <em>Pick</em><input type="date" id="dueDateInput"></label>
      </div>
    </div>
  </section>

  <div class="toolbar">
    <input type="search" id="search" dir="auto" placeholder="Search tasks or #tags…" autocomplete="off">
    <button class="ghost" id="toggleDoneBtn">Hide Done</button>
  </div>
  <div class="filters" id="filters"></div>

  <main id="list"></main>
  <div class="empty" id="empty" hidden></div>
</div>

<div class="sync" id="sync" data-state="local"><i></i><span id="syncText">Starting…</span></div>
<div class="toast" id="toast"><span id="toastText"></span><button id="undoBtn">Undo</button></div>

<div id="sheetWrap">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Edit task">
    <div class="grab"></div>
    <textarea id="eText" rows="2" dir="auto"></textarea>
    <div class="lbl">Priority</div>
    <div class="row" id="ePrio">
      <button class="chip low"  data-p="low">Low</button>
      <button class="chip med"  data-p="med">Med</button>
      <button class="chip high" data-p="high">High</button>
    </div>
    <div class="lbl">Due <span id="eDueTxt"></span></div>
    <div class="row" id="eDue">
      <button class="chip d" data-d="0">Today</button>
      <button class="chip d" data-d="1">Tmrw</button>
      <button class="chip d" data-d="2">+2d</button>
      <button class="chip d" data-d="7">+1W</button>
      <label class="chip d pick">📅 <em>Pick</em><input type="date" id="eDate"></label>
      <button class="chip" data-d="x">Clear</button>
    </div>
    <div class="lbl">Tags</div>
    <input type="text" id="eTags" dir="auto" placeholder="ward, labs, or">
    <div class="actions">
      <button class="btn danger" id="eDel">Delete</button>
      <button class="btn cancel" id="eCancel">Cancel</button>
      <button class="btn save" id="eSave">Save</button>
    </div>
  </div>
</div>

<script>
  // Google Apps Script Web App URL (deploy Code.gs: Execute as Me, Access: Anyone)
  const API_URL = "Yhttps://script.google.com/macros/s/AKfycbz9-O80XaNSPeC-eGEX9lARpX4LG6pmOELdbRYyttNgOhMEBiU876Id-NgBr_hcb_A7/exec";

  const API_OK = /^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL);
  const LS_KEY = 'smart_tasks_v2', LS_OLD = 'iphone_tasks', LS_UI = 'smart_tasks_ui';
  const DAY = 864e5, TOMBSTONE_TTL = 30 * DAY;
  const PR = { high: 3, med: 2, low: 1 };
  const PL = { high: 'HIGH', med: 'MED', low: 'LOW' };
  const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const WD_AR = ['احد','اثنين','ثلاثاء','اربعاء','خميس','جمعه','سبت'];
  const GROUPS = [
    ['overdue', 'Overdue',   'var(--red)'],
    ['today',   'Today',     'var(--orange)'],
    ['tomorrow','Tomorrow',  'var(--amber)'],
    ['week',    'This Week', 'var(--blue)'],
    ['later',   'Later',     'var(--purple)'],
    ['nodate',  'No Date',   'var(--teal)'],
    ['done',    'Completed', 'var(--green)']
  ];

  const $ = s => document.querySelector(s);

  /* ---------- storage ---------- */
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const safeJSON = s => { try { return JSON.parse(s); } catch (e) { return null; } };

  /* ---------- dates (stored yyyy-MM-dd, shown dd/MM/yyyy) ---------- */
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const sod = (d = new Date()) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const addDays = n => { const d = sod(); d.setDate(d.getDate() + n); return ymd(d); };
  const fromYMD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const diffDays = s => Math.round((fromYMD(s) - sod()) / DAY);
  const dmy = s => { const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
  const time12 = d => d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  function rel(s) {
    const n = diffDays(s);
    if (n < 0) return n === -1 ? 'Yesterday' : `${-n}d overdue`;
    if (n === 0) return 'Today';
    if (n === 1) return 'Tomorrow';
    if (n < 7) return WD[fromYMD(s).getDay()].slice(0, 3);
    return `in ${n}d`;
  }
  function mkDate(d, m, y) {
    const now = sod();
    const Y = y ? (y.length <= 2 ? 2000 + +y : +y) : now.getFullYear();
    const dt = new Date(Y, m - 1, d);
    if (dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
    if (!y && dt < now) dt.setFullYear(Y + 1);
    return ymd(dt);
  }
  function normDate(v) {
    if (!v) return '';
    const s = String(v).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
    if (m) return mkDate(+m[1], +m[2], m[3]) || '';
    const t = Date.parse(s);
    return isNaN(t) ? '' : ymd(new Date(t));
  }

  /* ---------- text helpers ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
  const norm = s => String(s).replace(/[\u064B-\u0652\u0640]/g, '').replace(/[أإآ]/g, 'ا')
    .replace(/ى/g, 'ي').replace(/ة/g, 'ه').toLowerCase();
  const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; return h % 360; };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
  const cleanTags = arr => [...new Set(arr.map(t => String(t).replace(/^#/, '').trim().toLowerCase()).filter(Boolean))];

  /* ---------- model ---------- */
  function normalize(t) {
    const now = Date.now();
    const created = t.createdAt ? (isNaN(+t.createdAt) ? Date.parse(t.createdAt) : +t.createdAt) : now;
    return {
      id: String(t.id ?? uid()),
      text: String(t.text ?? '').trim(),
      priority: PR[t.priority] ? t.priority : 'low',
      dueDate: normDate(t.dueDate),
      tags: cleanTags(Array.isArray(t.tags) ? t.tags : String(t.tags || '').split(',')),
      completed: t.completed === true || String(t.completed).toLowerCase() === 'true',
      completedAt: +t.completedAt || 0,
      createdAt: created || now,
      updatedAt: +t.updatedAt || 0,
      deleted: t.deleted === true || String(t.deleted).toLowerCase() === 'true'
    };
  }
  function load() {
    let d = safeJSON(lsGet(LS_KEY));
    if (!Array.isArray(d)) d = safeJSON(lsGet(LS_OLD)); // migrate v1 cache
    return Array.isArray(d) ? d.map(normalize).filter(t => t.text) : [];
  }

  let tasks = load();
  let ui = Object.assign({ hideDone: false, filter: 'all', tag: null }, safeJSON(lsGet(LS_UI)) || {});
  let draft = { priority: 'low', due: '' };
  let sheetDraft = { priority: 'low', due: '' };
  let editingId = null, freshId = null, popId = null;
  let editVersion = 0, syncing = false, syncTimer = null;
  let undoFn = null, toastTimer = null, lastDay = ymd(new Date());

  const find = id => tasks.find(t => t.id === id);
  const live = () => tasks.filter(t => !t.deleted);
  const touch = t => { t.updatedAt = Date.now(); };
  function persist() {
    const cutoff = Date.now() - TOMBSTONE_TTL;
    tasks = tasks.filter(t => !(t.deleted && t.updatedAt < cutoff));
    lsSet(LS_KEY, JSON.stringify(tasks));
  }
  const saveUI = () => lsSet(LS_UI, JSON.stringify(ui));
  function commit() { persist(); render(); markDirty(); }

  /* ---------- quick-add parser ---------- */
  function wdIndex(w) {
    const k = w.toLowerCase();
    if (/^[a-z]{3,}$/.test(k)) {
      const i = WD.findIndex(d => d.toLowerCase().startsWith(k));
      return i;
    }
    const a = norm(w).replace(/^ال/, '');
    return WD_AR.indexOf(a);
  }
  function nextWd(i) { const n = (i - new Date().getDay() + 7) % 7 || 7; return addDays(n); }

  function parseQuick(raw) {
    let s = ' ' + raw.replace(/\s+/g, ' ') + ' ';
    let priority = null, due = null; const tags = [];
    s = s.replace(/\s(!!!|!!|!h(?:igh)?|!m(?:ed)?|!l(?:ow)?|!)(?=\s)/gi, (_, p) => {
      p = p.toLowerCase();
      priority = (p === '!!!' || p[1] === 'h') ? 'high' : (p === '!!' || p[1] === 'm') ? 'med' : 'low';
      return ' ';
    });
    s = s.replace(/\s#([\p{L}\p{N}_-]+)(?=\s)/gu, (_, g) => { tags.push(g.toLowerCase()); return ' '; });
    s = s.replace(/\s@(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?(?=\s)/g, (m, d, mo, y) => {
      const r = mkDate(+d, +mo, y); if (!r) return m; due = r; return ' ';
    });
    s = s.replace(/\s@\+?(\d{1,3})d?(?=\s)/gi, (_, n) => { due = addDays(+n); return ' '; });
    s = s.replace(/\s@?(today|tod|اليوم|النهارده|النهاردة)(?=\s)/gi, () => { due = addDays(0); return ' '; });
    s = s.replace(/\s@?(tomorrow|tmrw|tmr|بكرة|بكره|غدا|غداً)(?=\s)/gi, () => { due = addDays(1); return ' '; });
    s = s.replace(/\s@(\S+)(?=\s)/g, (m, w) => { const i = wdIndex(w); if (i < 0) return m; due = nextWd(i); return ' '; });
    return { text: s.replace(/\s+/g, ' ').trim(), priority, due, tags: cleanTags(tags) };
  }

  /* ---------- grouping / filtering ---------- */
  function bucket(t) {
    if (t.completed) return 'done';
    if (!t.dueDate) return 'nodate';
    const d = diffDays(t.dueDate);
    if (d < 0) return 'overdue';
    if (d === 0) return 'today';
    if (d === 1) return 'tomorrow';
    if (d <= 7) return 'week';
    return 'later';
  }
  const cmp = (a, b) => PR[b.priority] - PR[a.priority]
    || (a.dueDate || '9999').localeCompare(b.dueDate || '9999')
    || a.createdAt - b.createdAt;

  function matches(t, q) {
    const b = bucket(t);
    if (ui.hideDone && t.completed && ui.filter !== 'done') return false;
    if (ui.filter === 'overdue' && b !== 'overdue') return false;
    if (ui.filter === 'today' && b !== 'today') return false;
    if (ui.filter === 'high' && (t.completed || t.priority !== 'high')) return false;
    if (ui.filter === 'done' && !t.completed) return false;
    if (ui.tag && !t.tags.includes(ui.tag)) return false;
    if (q) {
      const qq = q.replace(/^#/, '');
      if (!norm(t.text).includes(q) && !t.tags.some(g => norm(g).includes(qq))) return false;
    }
    return true;
  }

  /* ---------- render ---------- */
  function card(t) {
    let dueHtml = '';
    if (t.completed && t.completedAt) {
      const c = new Date(t.completedAt);
      dueHtml = `<span class="due">✓ ${dmy(ymd(c))} · ${time12(c)}</span>`;
    } else if (t.dueDate) {
      const n = diffDays(t.dueDate);
      dueHtml = `<span class="due ${n < 0 ? 'over' : n === 0 ? 'today' : ''}">◷ ${rel(t.dueDate)} · ${dmy(t.dueDate)}</span>`;
    }
    const cls = ['task', 'p-' + t.priority, t.completed && 'done', t.id === freshId && 'new', t.id === popId && 'pop']
      .filter(Boolean).join(' ');
    return `<div class="${cls}" data-id="${esc(t.id)}">
      <button class="chk" data-act="toggle" aria-label="Toggle complete"><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></button>
      <div class="body" data-act="edit">
        <div class="title" dir="auto">${esc(t.text)}</div>
        <div class="meta"><span class="pt">${PL[t.priority]}</span>${dueHtml}${t.tags.map(g => `<span class="tag" style="--h:${hue(g)}" dir="auto">#${esc(g)}</span>`).join('')}</div>
      </div>
      <button class="del" data-act="delete" aria-label="Delete">×</button>
    </div>`;
  }

  function render() {
    const all = live();
    let over = 0, today = 0, high = 0, done = 0;
    all.forEach(t => {
      const b = bucket(t);
      if (b === 'overdue') over++;
      if (b === 'today') today++;
      if (!t.completed && t.priority === 'high') high++;
      if (t.completed) done++;
    });
    $('#cOver').textContent = over; $('#cToday').textContent = today;
    $('#cHigh').textContent = high; $('#cDone').textContent = done;
    const pct = all.length ? Math.round(done / all.length * 100) : 0;
    $('#ring').style.setProperty('--p', pct); $('#ringPct').textContent = pct + '%';
    document.querySelectorAll('.stat').forEach(b => b.classList.toggle('active', ui.filter === b.dataset.filter));
    $('#toggleDoneBtn').textContent = ui.hideDone ? `Show Done${done ? ' (' + done + ')' : ''}` : 'Hide Done';

    // tag filter bar
    const tagCount = {};
    all.forEach(t => !t.completed && t.tags.forEach(g => tagCount[g] = (tagCount[g] || 0) + 1));
    const tagList = Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a]);
    if (ui.tag && !tagCount[ui.tag]) ui.tag = null;
    const fEl = $('#filters');
    if (tagList.length || ui.filter !== 'all') {
      fEl.hidden = false;
      fEl.innerHTML = `<button class="chip f ${ui.filter === 'all' && !ui.tag ? 'active' : ''}" data-tag="">${ui.filter === 'all' && !ui.tag ? 'All' : '✕ Clear filter'}</button>`
        + tagList.map(g => `<button class="chip tagf ${ui.tag === g ? 'active' : ''}" style="--h:${hue(g)}" data-tag="${esc(g)}" dir="auto">#${esc(g)} · ${tagCount[g]}</button>`).join('');
    } else { fEl.hidden = true; fEl.innerHTML = ''; }

    // list
    const q = norm($('#search').value.trim());
    const shown = all.filter(t => matches(t, q));
    const byG = {};
    shown.forEach(t => (byG[bucket(t)] ??= []).push(t));
    let html = '';
    GROUPS.forEach(([k, label, color]) => {
      const arr = byG[k]; if (!arr) return;
      arr.sort(k === 'done' ? (a, b) => b.completedAt - a.completedAt : cmp);
      html += `<section class="group" style="--gc:${color}">
        <div class="g-head">${label}<span class="g-count">${arr.length}</span>${k === 'done' ? '<button class="g-clear" data-clear>Clear all</button>' : ''}</div>
        ${arr.map(card).join('')}</section>`;
    });
    $('#list').innerHTML = html;
    const empty = $('#empty');
    empty.hidden = !!shown.length;
    if (!shown.length) empty.innerHTML = all.length
      ? '<b>🔍</b>Nothing in this view'
      : '<b>✨</b>No tasks yet — add one above';
    freshId = null; popId = null;
  }

  function paintPrio(row, val) { row.querySelectorAll('[data-p]').forEach(b => b.classList.toggle('active', b.dataset.p === val)); }
  function paintDue(row, input, val) {
    let preset = false;
    row.querySelectorAll('[data-d]').forEach(b => {
      const on = b.dataset.d !== 'x' && val === addDays(+b.dataset.d);
      if (on) preset = true;
      b.classList.toggle('active', on);
    });
    const pick = row.querySelector('.pick');
    const custom = !!val && !preset;
    pick.classList.toggle('active', custom);
    pick.querySelector('em').textContent = custom ? dmy(val).slice(0, 5) : 'Pick';
    input.value = val || '';
  }
  function wireDue(row, input, get, set) {
    row.addEventListener('click', e => {
      const b = e.target.closest('[data-d]');
      if (b) {
        if (b.dataset.d === 'x') set('');
        else { const d = addDays(+b.dataset.d); set(get() === d ? '' : d); }
        return;
      }
      if (e.target.closest('.pick') && e.target !== input) { try { input.showPicker(); } catch (_) {} }
    });
    input.addEventListener('change', () => { if (input.value) set(input.value); });
  }

  function paintAdd() {
    paintPrio($('#prioSeg'), draft.priority);
    paintDue($('#dateSeg'), $('#dueDateInput'), draft.due);
    paintPreview();
  }
  function paintPreview() {
    const raw = $('#taskInput').value.trim();
    const el = $('#preview');
    if (!raw) { el.innerHTML = ''; return; }
    const p = parseQuick(raw);
    const pr = p.priority || draft.priority, due = p.due || draft.due;
    el.innerHTML = `<span class="chip pv p-${pr}">● ${PL[pr]}</span>`
      + (due ? `<span class="chip pv due">◷ ${rel(due)} · ${dmy(due)}</span>` : '')
      + p.tags.map(g => `<span class="tag" style="--h:${hue(g)}" dir="auto">#${esc(g)}</span>`).join('');
  }

  /* ---------- actions ---------- */
  function addTask() {
    const input = $('#taskInput');
    const raw = input.value.trim(); if (!raw) return;
    const p = parseQuick(raw);
    if (!p.text) { showToast('Task text is empty'); return; }
    const now = Date.now();
    const t = {
      id: uid(), text: p.text, priority: p.priority || draft.priority, dueDate: p.due || draft.due || '',
      tags: p.tags, completed: false, completedAt: 0, createdAt: now, updatedAt: now, deleted: false
    };
    tasks.push(t); freshId = t.id;
    input.value = ''; draft.due = '';
    paintAdd(); buzz(8); commit();
  }
  function toggle(id) {
    const t = find(id); if (!t) return;
    t.completed = !t.completed;
    t.completedAt = t.completed ? Date.now() : 0;
    touch(t); popId = id; buzz(t.completed ? [10, 40, 10] : 8); commit();
  }
  function del(id) {
    const t = find(id); if (!t) return;
    t.deleted = true; touch(t); commit(); buzz(15);
    showToast(`Deleted “${t.text}”`, () => { const x = find(id); if (x) { x.deleted = false; touch(x); commit(); } });
  }
  function clearDone() {
    const ids = live().filter(t => t.completed).map(t => t.id);
    if (!ids.length) return;
    ids.forEach(id => { const t = find(id); t.deleted = true; touch(t); });
    commit();
    showToast(`Cleared ${ids.length} completed`, () => {
      ids.forEach(id => { const x = find(id); if (x) { x.deleted = false; touch(x); } }); commit();
    });
  }

  /* ---------- edit sheet ---------- */
  function openSheet(id) {
    const t = find(id); if (!t) return;
    editingId = id;
    sheetDraft = { priority: t.priority, due: t.dueDate };
    $('#eText').value = t.text;
    $('#eTags').value = t.tags.join(', ');
    paintSheet();
    document.body.classList.add('sheet-open');
  }
  function paintSheet() {
    paintPrio($('#ePrio'), sheetDraft.priority);
    paintDue($('#eDue'), $('#eDate'), sheetDraft.due);
    $('#eDueTxt').textContent = sheetDraft.due ? `${rel(sheetDraft.due)} · ${dmy(sheetDraft.due)}` : 'None';
  }
  function closeSheet() { document.body.classList.remove('sheet-open'); editingId = null; document.activeElement?.blur(); }
  function saveSheet() {
    const t = find(editingId); if (!t) return closeSheet();
    const text = $('#eText').value.replace(/\s+/g, ' ').trim();
    if (!text) { showToast('Task text is empty'); return; }
    t.text = text;
    t.priority = sheetDraft.priority;
    t.dueDate = sheetDraft.due || '';
    t.tags = cleanTags($('#eTags').value.split(/[,،]+/));
    touch(t); closeSheet(); commit();
  }

  /* ---------- toast ---------- */
  function showToast(msg, undo) {
    $('#toastText').textContent = msg;
    $('#undoBtn').hidden = !undo;
    undoFn = undo || null;
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, undo ? 5000 : 2200);
  }
  function hideToast() { $('#toast').classList.remove('show'); undoFn = null; }

  /* ---------- sync (POST text/plain = no CORS preflight; per-task last-write-wins) ---------- */
  function setSync(state, text) { $('#sync').dataset.state = state; $('#syncText').textContent = text; }
  function queueSync(delay = 700) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, delay); }
  function markDirty() { editVersion++; queueSync(); }

  function merge(local, server) {
    const map = new Map(local.map(t => [t.id, t]));
    server.forEach(s => { const l = map.get(s.id); if (!l || s.updatedAt >= l.updatedAt) map.set(s.id, s); });
    return [...map.values()];
  }

  async function sync() {
    if (!API_OK) { setSync('local', 'Local only · set API_URL'); return; }
    if (!navigator.onLine) { setSync('local', 'Offline · saved on device'); return; }
    if (syncing) { queueSync(); return; }
    syncing = true;
    const v = editVersion;
    setSync('busy', 'Syncing…');
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 20000);
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'sync', tasks }),
        signal: ctrl.signal
      });
      const data = await res.json();
      if (!data || !data.ok || !Array.isArray(data.tasks)) throw new Error((data && data.error) || 'Bad response');
      tasks = merge(tasks, data.tasks.map(normalize));
      persist();
      if (!document.body.classList.contains('sheet-open')) render();
      setSync('ok', 'Synced · ' + time12(new Date()));
    } catch (e) {
      setSync('err', (e.name === 'AbortError' ? 'Timeout' : 'Sync failed') + ' · saved on device');
    } finally {
      clearTimeout(to);
      syncing = false;
      if (editVersion !== v) queueSync(300);
    }
  }

  /* ---------- wiring ---------- */
  function paintToday() {
    const d = new Date();
    $('#todayLine').textContent = `${WD[d.getDay()]} · ${dmy(ymd(d))}`;
  }

  $('#addBtn').addEventListener('click', addTask);
  $('#taskInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addTask(); } });
  $('#taskInput').addEventListener('input', paintPreview);
  $('#prioSeg').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) { draft.priority = b.dataset.p; paintAdd(); } });
  wireDue($('#dateSeg'), $('#dueDateInput'), () => draft.due, v => { draft.due = v; paintAdd(); });

  $('#search').addEventListener('input', render);
  $('#toggleDoneBtn').addEventListener('click', () => { ui.hideDone = !ui.hideDone; saveUI(); render(); });
  $('#stats').addEventListener('click', e => {
    const b = e.target.closest('[data-filter]'); if (!b) return;
    ui.filter = ui.filter === b.dataset.filter ? 'all' : b.dataset.filter; saveUI(); render();
  });
  $('#filters').addEventListener('click', e => {
    const b = e.target.closest('[data-tag]'); if (!b) return;
    const g = b.dataset.tag;
    if (!g) { ui.tag = null; ui.filter = 'all'; } else ui.tag = ui.tag === g ? null : g;
    saveUI(); render();
  });
  $('#list').addEventListener('click', e => {
    if (e.target.closest('[data-clear]')) return clearDone();
    const el = e.target.closest('[data-act]'); if (!el) return;
    const id = el.closest('.task').dataset.id;
    ({ toggle, edit: openSheet, delete: del })[el.dataset.act](id);
  });

  $('#ePrio').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) { sheetDraft.priority = b.dataset.p; paintSheet(); } });
  wireDue($('#eDue'), $('#eDate'), () => sheetDraft.due, v => { sheetDraft.due = v; paintSheet(); });
  $('#eSave').addEventListener('click', saveSheet);
  $('#eCancel').addEventListener('click', closeSheet);
  $('#sheetBg').addEventListener('click', closeSheet);
  $('#eDel').addEventListener('click', () => { const id = editingId; closeSheet(); del(id); });
  $('#undoBtn').addEventListener('click', () => { if (undoFn) undoFn(); hideToast(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && editingId) closeSheet(); });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (ymd(new Date()) !== lastDay) { lastDay = ymd(new Date()); paintToday(); render(); }
    queueSync(0);
  });
  window.addEventListener('online', () => queueSync(0));
  window.addEventListener('offline', () => setSync('local', 'Offline · saved on device'));
  setInterval(() => {
    if (ymd(new Date()) !== lastDay) { lastDay = ymd(new Date()); paintToday(); render(); paintAdd(); }
  }, 60000);
  setInterval(() => { if (document.visibilityState === 'visible' && !syncing) queueSync(0); }, 120000);

  paintToday();
  paintAdd();
  render();      // instant render from device cache
  sync();        // then reconcile with Google Sheets
</script>
</body>
</html>
