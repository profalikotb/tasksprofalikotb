<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Smart Tasks</title>
  <style>
    :root {
      --bg: #F2F2F7;
      --card-bg: #FFFFFF;
      --text-active: #000000;
      --text-dim: #8E8E93;
      --border: #E5E5EA;
      --accent-green: #34C759;
      --primary-blue: #007AFF;
      --priority-high: #FF3B30;
      --priority-med: #FF9500;
      --priority-low: #34C759;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-active);
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 500px;
      margin: 12px auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 4px;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
      background: linear-gradient(135deg, #1C1C1E 0%, #3A3A3C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .toggle-btn {
      background: #E5E5EA;
      color: var(--primary-blue);
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .toggle-btn:active {
      transform: scale(0.95);
      background: #D1D1D6;
    }

    .add-box-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      margin-bottom: 20px;
      border: 1px solid rgba(229,229,234,0.6);
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-row input[type="text"] {
      flex: 1;
      border: none;
      outline: none;
      font-size: 17px;
      font-weight: 600;
      padding: 8px 4px;
      background: transparent;
      color: var(--text-active);
    }

    .input-row input::placeholder {
      color: #C7C7CC;
      font-weight: 500;
    }

    .add-btn {
      background: linear-gradient(135deg, #007AFF 0%, #0056B3 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,122,255,0.3);
      transition: transform 0.1s ease;
    }

    .add-btn:active {
      transform: scale(0.96);
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .priority-selector {
      display: flex;
      gap: 6px;
    }

    .priority-chip {
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #F2F2F7;
      color: var(--text-dim);
    }

    .priority-chip.active.high { background: var(--priority-high); color: white; border-color: var(--priority-high); }
    .priority-chip.active.med { background: var(--priority-med); color: white; border-color: var(--priority-med); }
    .priority-chip.active.low { background: var(--priority-low); color: white; border-color: var(--priority-low); }

    .date-input {
      border: none;
      background: #F2F2F7;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-active);
      outline: none;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      overflow: hidden;
      border: 1px solid rgba(229,229,234,0.6);
    }

    li {
      display: flex;
      align-items: center;
      padding: 16px;
      border-bottom: 0.5px solid var(--border);
      transition: background 0.2s ease;
    }

    li:last-child {
      border-bottom: none;
    }

    .checkbox {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #C7C7CC;
      margin-right: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .checkbox svg {
      display: none;
      width: 14px;
      height: 14px;
      fill: white;
    }

    .task-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .task-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-active);
      word-break: break-word;
      transition: color 0.2s ease;
    }

    .task-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
    }

    .p-tag {
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 10px;
      text-transform: uppercase;
    }

    .p-tag.high { background: rgba(255,59,48,0.15); color: var(--priority-high); }
    .p-tag.med { background: rgba(255,149,0,0.15); color: var(--priority-med); }
    .p-tag.low { background: rgba(52,199,89,0.15); color: var(--priority-low); }

    .due-tag {
      color: var(--text-dim);
    }

    /* Completed state */
    li.completed .checkbox {
      background-color: var(--accent-green);
      border-color: var(--accent-green);
    }

    li.completed .checkbox svg {
      display: block;
    }

    li.completed .task-title {
      color: var(--text-dim);
      text-decoration: line-through;
      font-weight: 600;
    }

    li.hidden {
      display: none;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #FF3B30;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      opacity: 0.3;
      padding: 0 4px;
      transition: opacity 0.2s ease;
    }

    .delete-btn:hover, .delete-btn:active {
      opacity: 1;
    }

    .status-tag {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h1>Smart Tasks</h1>
    <button class="toggle-btn" id="toggleDoneBtn" onclick="toggleHideDone()">Hide Done</button>
  </div>
  
  <div class="add-box-card">
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task..." onkeydown="if(event.key === 'Enter') addTask()">
      <button class="add-btn" onclick="addTask()">Add</button>
    </div>
    
    <div class="options-row">
      <div class="priority-selector">
        <span class="priority-chip active low" id="p-low" onclick="setPriority('low')">Low</span>
        <span class="priority-chip med" id="p-med" onclick="setPriority('med')">Med</span>
        <span class="priority-chip high" id="p-high" onclick="setPriority('high')">High</span>
      </div>
      <input type="date" id="dueDateInput" class="date-input">
    </div>
  </div>

  <ul id="taskList"></ul>
  <div class="status-tag" id="statusTag">Initializing...</div>
</div>

<script>
  // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
  const API_URL = "https://script.google.com/macros/s/AKfycbz9-O80XaNSPeC-eGEX9lARpX4LG6pmOELdbRYyttNgOhMEBiU876Id-NgBr_hcb_A7/exec";

  let tasks = [];
  let hideDone = false;
  let currentPriority = 'low';

  function setPriority(p) {
    currentPriority = p;
    document.querySelectorAll('.priority-chip').forEach(el => el.classList.remove('active'));
    document.getElementById(`p-${p}`).classList.add('active');
  }

  async function fetchTasks() {
    document.getElementById('statusTag').innerText = "Loading from Google Sheets...";
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      if (Array.isArray(data)) {
        tasks = data;
        localStorage.setItem('iphone_tasks', JSON.stringify(tasks));
        document.getElementById('statusTag').innerText = "Synced with Google Sheets";
      }
    } catch (e) {
      tasks = JSON.parse(localStorage.getItem('iphone_tasks')) || [];
      document.getElementById('statusTag').innerText = "Offline Mode (Local Cache)";
    }
    render();
  }

  async function syncToGoogleSheets() {
    document.getElementById('statusTag').innerText = "Saving to Google Sheets...";
    localStorage.setItem('iphone_tasks', JSON.stringify(tasks));
    render();

    try {
      const encodedData = encodeURIComponent(JSON.stringify(tasks));
      const saveUrl = `${API_URL}?action=save&data=${encodedData}`;
      
      const res = await fetch(saveUrl);
      const result = await res.json();
      
      if (result.status === "success") {
        document.getElementById('statusTag').innerText = "Saved to Google Sheets";
      } else {
        document.getElementById('statusTag').innerText = "Saved Locally";
      }
    } catch (e) {
      document.getElementById('statusTag').innerText = "Saved Locally (Offline)";
    }
  }

  function addTask() {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;

    const dueDate = document.getElementById('dueDateInput').value || '';

    tasks.push({
      id: Date.now(),
      text: text,
      priority: currentPriority,
      dueDate: dueDate,
      completed: false,
      createdAt: new Date().toISOString()
    });

    input.value = '';
    document.getElementById('dueDateInput').value = '';
    syncToGoogleSheets();
  }

  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
    syncToGoogleSheets();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    syncToGoogleSheets();
  }

  function toggleHideDone() {
    hideDone = !hideDone;
    document.getElementById('toggleDoneBtn').innerText = hideDone ? "Show Done" : "Hide Done";
    render();
  }

  function render() {
    const list = document.getElementById('taskList');
    list.innerHTML = '';

    const sortedTasks = [...tasks].sort((a, b) => a.completed - b.completed);

    sortedTasks.forEach(task => {
      const li = document.createElement('li');
      if (task.completed) {
        li.classList.add('completed');
        if (hideDone) li.classList.add('hidden');
      }

      const pClass = task.priority || 'low';
      const dueDisplay = task.dueDate ? `📅 ${task.dueDate}` : '';

      li.innerHTML = `
        <div class="checkbox" onclick="toggleTask(${task.id})">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <div class="task-content" onclick="toggleTask(${task.id})">
          <span class="task-title">${escapeHtml(task.text)}</span>
          <div class="task-meta">
            <span class="p-tag ${pClass}">${pClass}</span>
            ${dueDisplay ? `<span class="due-tag">${dueDisplay}</span>` : ''}
          </div>
        </div>
        <button class="delete-btn" onclick="deleteTask(${task.id})">&times;</button>
      `;

      list.appendChild(li);
    });
  }

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    })[m]);
  }

  fetchTasks();
</script>

</body>
</html>
